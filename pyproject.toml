[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tg-torrent-downloader"
version = "0.1.0"
description = "Telegram bot for selecting RuTracker torrents and submitting them to Transmission"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiogram>=3.28,<4",
  "aiohttp>=3.14,<4",
  "beautifulsoup4>=4.14,<5",
  "python-dotenv>=1.2,<2",
  "playwright>=1.55,<2",
]

[project.scripts]
tg-torrent-downloader = "tg_torrent_downloader.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
